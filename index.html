<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Álbum Copa 2026 🏆</title>
<style>
  :root {
    --bg: #ffffff;
    --bg2: #f7f8fa;
    --bg3: #eef0f4;
    --bg4: #e2e5ec;
    --text: #111827;
    --text2: #6b7280;
    --border: #e2e5ec;
    --border2: #d1d5db;
    --green: #16a34a; --green-bg: #dcfce7; --green-border: #22c55e; --green-text: #15803d;
    --red: #dc2626; --red-bg: #fee2e2; --red-border: #ef4444; --red-text: #b91c1c;
    --amber: #d97706; --amber-bg: #fef3c7; --amber-border: #f59e0b; --amber-text: #b45309;
    --radius-sm: 8px; --radius-md: 10px; --radius-lg: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; min-height: 100vh; }
  .container { max-width: 980px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

  /* Header */
  .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 12px; }
  .header-left { display: flex; flex-direction: column; gap: 5px; }
  .header-title { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  .save-indicator { font-size: 11px; color: var(--text2); display: flex; align-items: center; gap: 5px; }
  .save-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: inline-block; flex-shrink: 0; }
  .save-dot.saving { background: var(--amber); animation: pulse 0.8s infinite; }
  .save-dot.error { background: var(--red); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* Stats */
  .stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat { background: var(--bg2); border-radius: var(--radius-md); padding: 7px 16px; text-align: center; min-width: 78px; border: 1px solid var(--border); }
  .stat .num { font-size: 22px; font-weight: 700; }
  .stat .lbl { font-size: 10px; color: var(--text2); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.05em; }
  .num-total  { color: var(--text); }
  .num-tengo  { color: var(--green); }
  .num-falta  { color: var(--red); }
  .num-repetida { color: var(--amber); }

  /* Toolbar */
  .toolbar { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
  .toolbar input { flex: 1; min-width: 160px; padding: 8px 13px; font-size: 13px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg2); color: var(--text); outline: none; }
  .toolbar input::placeholder { color: var(--text2); }
  .toolbar input:focus { border-color: var(--border2); box-shadow: 0 0 0 2px rgba(99,102,241,0.15); }

  .edit-btn { display: flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: 13px; font-weight: 500; border: 1px solid var(--border); border-radius: var(--radius-md); cursor: pointer; background: var(--bg2); color: var(--text2); transition: all 0.15s; white-space: nowrap; }
  .edit-btn.active { background: rgba(245,158,11,0.15); border-color: var(--amber-border); color: var(--amber-text); }

  .filter-btn { padding: 7px 14px; font-size: 13px; border: 1px solid var(--border); border-radius: var(--radius-md); cursor: pointer; background: var(--bg2); color: var(--text2); transition: all 0.15s; white-space: nowrap; }
  .filter-btn:hover { background: var(--bg3); }
  .filter-btn.active-all      { background: var(--bg3); color: var(--text); font-weight: 500; border-color: #4a5568; }
  .filter-btn.active-tengo    { background: var(--green-bg); color: var(--green-text); border-color: var(--green-border); font-weight: 500; }
  .filter-btn.active-falta    { background: var(--red-bg);   color: var(--red-text);   border-color: var(--red-border);   font-weight: 500; }
  .filter-btn.active-repetida { background: var(--amber-bg); color: var(--amber-text); border-color: var(--amber-border); font-weight: 500; }

  .clear-btn { padding: 7px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: var(--radius-md); cursor: pointer; background: var(--bg2); color: var(--text2); display: none; white-space: nowrap; }
  .clear-btn:hover { background: var(--bg3); }
  .clear-btn.visible { display: inline-block; }

  .menu-wrap { position: relative; margin-left: auto; }
  .hamburger { width: 38px; height: 38px; border: 1px solid var(--border); border-radius: var(--radius-md); cursor: pointer; background: var(--bg2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .hamburger:hover { background: var(--bg3); }
  .hamburger span { display: block; width: 16px; height: 2px; background: var(--text2); border-radius: 2px; }
  .menu-dropdown { display: none; position: absolute; right: 0; top: calc(100% + 6px); background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: 0 8px 30px rgba(0,0,0,0.4); min-width: 190px; z-index: 50; overflow: hidden; }
  .menu-dropdown.open { display: block; }
  .menu-item { padding: 12px 16px; font-size: 13px; cursor: pointer; color: var(--text); transition: background 0.1s; }
  .menu-item:hover { background: var(--bg3); }
  .menu-item.danger { color: var(--red-text); }
  .menu-item.danger:hover { background: var(--red-bg); }
  .menu-divider { height: 1px; background: var(--border); }

  /* Cambios */
  .cambios-section { background: var(--bg2); border-radius: var(--radius-lg); padding: 12px 16px; margin-bottom: 1rem; border: 1px solid var(--border); }
  .cambios-title { font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.05em; }
  .cambios-list { font-size: 12px; color: var(--text2); max-height: 80px; overflow-y: auto; line-height: 2; white-space: pre-line; }

  /* Groups */
  .groups { display: flex; flex-direction: column; gap: 1rem; }
  .group-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
  .group-card.group-hidden { display: none; }
  .group-header { padding: 10px 16px; background: var(--bg3); display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
  .group-header:hover { background: var(--bg4); }
  .group-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .group-progress { font-size: 12px; color: var(--text2); }
  .progress-bar-wrap { height: 2px; background: var(--bg4); }
  .progress-bar { height: 2px; background: var(--green); transition: width 0.3s; }
  .teams-grid { display: flex; flex-wrap: wrap; gap: 1.25rem; padding: 14px 16px; justify-content: center; }
  .team-section { display: flex; flex-direction: column; align-items: center; }
  .team-label { font-size: 10px; font-weight: 700; color: var(--text2); margin-bottom: 8px; letter-spacing: 0.06em; text-transform: uppercase; }
  .stickers { display: flex; flex-wrap: wrap; gap: 6px; }
  .group-body { display: block; }
  .group-body.collapsed { display: none; }

  /* ── Identidad de grupo ── */
  .group-card[data-group="A"] .group-header { background: #fef3f2; border-bottom: 2px solid #fca5a5; }
  .group-card[data-group="A"] .group-title  { color: #991b1b; }
  .group-card[data-group="A"] .progress-bar { background: #ef4444; }

  .group-card[data-group="B"] .group-header { background: #fff7ed; border-bottom: 2px solid #fdba74; }
  .group-card[data-group="B"] .group-title  { color: #9a3412; }
  .group-card[data-group="B"] .progress-bar { background: #f97316; }

  .group-card[data-group="C"] .group-header { background: #fefce8; border-bottom: 2px solid #fde047; }
  .group-card[data-group="C"] .group-title  { color: #854d0e; }
  .group-card[data-group="C"] .progress-bar { background: #eab308; }

  .group-card[data-group="D"] .group-header { background: #f0fdf4; border-bottom: 2px solid #86efac; }
  .group-card[data-group="D"] .group-title  { color: #14532d; }
  .group-card[data-group="D"] .progress-bar { background: #22c55e; }

  .group-card[data-group="E"] .group-header { background: #ecfdf5; border-bottom: 2px solid #6ee7b7; }
  .group-card[data-group="E"] .group-title  { color: #064e3b; }
  .group-card[data-group="E"] .progress-bar { background: #10b981; }

  .group-card[data-group="F"] .group-header { background: #ecfeff; border-bottom: 2px solid #67e8f9; }
  .group-card[data-group="F"] .group-title  { color: #164e63; }
  .group-card[data-group="F"] .progress-bar { background: #06b6d4; }

  .group-card[data-group="G"] .group-header { background: #eff6ff; border-bottom: 2px solid #93c5fd; }
  .group-card[data-group="G"] .group-title  { color: #1e3a8a; }
  .group-card[data-group="G"] .progress-bar { background: #3b82f6; }

  .group-card[data-group="H"] .group-header { background: #f5f3ff; border-bottom: 2px solid #c4b5fd; }
  .group-card[data-group="H"] .group-title  { color: #4c1d95; }
  .group-card[data-group="H"] .progress-bar { background: #8b5cf6; }

  .group-card[data-group="I"] .group-header { background: #fdf4ff; border-bottom: 2px solid #e879f9; }
  .group-card[data-group="I"] .group-title  { color: #701a75; }
  .group-card[data-group="I"] .progress-bar { background: #d946ef; }

  .group-card[data-group="J"] .group-header { background: #fff1f2; border-bottom: 2px solid #fda4af; }
  .group-card[data-group="J"] .group-title  { color: #881337; }
  .group-card[data-group="J"] .progress-bar { background: #f43f5e; }

  .group-card[data-group="K"] .group-header { background: #fff7ed; border-bottom: 2px solid #fed7aa; }
  .group-card[data-group="K"] .group-title  { color: #7c2d12; }
  .group-card[data-group="K"] .progress-bar { background: #fb923c; }

  .group-card[data-group="L"] .group-header { background: #f0fdf4; border-bottom: 2px solid #a3e635; }
  .group-card[data-group="L"] .group-title  { color: #1a2e05; }
  .group-card[data-group="L"] .progress-bar { background: #65a30d; }

  .group-card[data-group="E_"] .group-header { background: #f8fafc; border-bottom: 2px solid #cbd5e1; }
  .group-card[data-group="E_"] .group-title  { color: #334155; }
  .group-card[data-group="E_"] .progress-bar { background: #64748b; }

  /* ── CARTA grande ── */
  .sticker {
    width: 90px;
    height: 126px;
    border-radius: 10px;
    border: 2px solid rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-end;
    padding: 0;
    position: relative;
    user-select: none;
    cursor: default;
    transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
    overflow: hidden;
    filter: brightness(0.5) saturate(0.12) grayscale(0.5);
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
  }
  /* En mobile: 4 columnas exactas */
  @media (max-width: 520px) {
    .teams-grid { padding: 10px 8px; gap: 1rem 0.5rem; }
    .stickers { gap: 5px; }
    .sticker {
      width: calc((100vw - 48px) / 4);
      height: calc((100vw - 48px) / 4 * 1.4);
    }
    .sticker .s-num { font-size: 16px; }
    .sticker .s-name { font-size: 6.5px; }
    .sticker .s-num-top { font-size: 12px; top: 4px; left: 4px; }
    .sticker .s-rep-btn { font-size: 9px; padding: 2px 5px; top: 4px; left: 4px; }
    .sticker .s-band { padding: 10px 3px 5px; }
  }
  .sticker::before {
    content: '';
    position: absolute;
    inset: 0;
    background: inherit;
    border-radius: 9px;
    z-index: 0;
  }

  /* Foto ocupa todo el alto */
  .sticker .s-photo {
    position: absolute;
    inset: 0;
    background-size: 130%;
    background-position: top center;
    background-repeat: no-repeat;
    z-index: 1;
    opacity: 0;
    transition: opacity 0.35s;
  }
  .sticker .s-photo.loaded { opacity: 1; }

  /* Banda inferior */
  .sticker .s-band {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 14px 4px 6px;
    background: linear-gradient(0deg, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.7) 60%, transparent 100%);
  }

  .sticker .s-num {
    font-size: 22px;
    font-weight: 900;
    line-height: 1;
    color: white;
    text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    z-index: 3;
    letter-spacing: -1px;
  }

  .sticker .s-name {
    font-size: 8px;
    font-weight: 700;
    color: rgba(255,255,255,0.95);
    letter-spacing: 0.01em;
    text-align: center;
    z-index: 3;
    line-height: 1.2;
    width: 84px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
  }
  .sticker .s-bottom {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    z-index: 3;
  }
  .sticker .s-flag {
    width: 18px;
    height: 13px;
    border-radius: 2px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    line-height: 1;
    flex-shrink: 0;
  }
  .sticker .s-flag img {
    width: 18px;
    height: 13px;
    object-fit: cover;
    display: block;
  }
  .sticker .s-code {
    font-size: 8px;
    font-weight: 800;
    color: rgba(255,255,255,0.85);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    z-index: 3;
  }

  /* Número top-left sin foto */
  .sticker .s-num-top {
    display: none;
    position: absolute;
    top: 6px; left: 7px;
    font-size: 15px;
    font-weight: 900;
    color: white;
    text-shadow: 0 1px 4px rgba(0,0,0,0.7);
    z-index: 3;
    line-height: 1;
  }
  .sticker:not(.has-photo) .s-num-top { display: block; }

  .sticker .s-photo-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.0) 35%, rgba(0,0,0,0.5) 70%, rgba(0,0,0,0.82) 100%);
    z-index: 2;
    display: none;
  }
  .sticker.has-photo .s-photo-overlay { display: block; }

  /* Estados */
  .sticker.editable { cursor: pointer; }
  .sticker.editable:hover {
    transform: translateY(-5px) scale(1.05);
    box-shadow: 0 12px 28px rgba(0,0,0,0.22);
    filter: brightness(0.75) saturate(0.4) grayscale(0.15);
  }
  .sticker.tengo {
    filter: brightness(1) saturate(1);
    border: 3px solid #16a34a;
    box-shadow: 0 0 0 1px #16a34a, 0 4px 16px rgba(22,163,74,0.3);
  }
  .sticker.tengo.editable:hover {
    filter: brightness(1.06) saturate(1.08);
    transform: translateY(-5px) scale(1.05);
    box-shadow: 0 0 0 1px #16a34a, 0 14px 30px rgba(22,163,74,0.25);
  }

  /* Check */
  .sticker.tengo::after {
    content: '✓';
    position: absolute;
    top: 6px; right: 7px;
    font-size: 14px;
    font-weight: 900;
    color: #86efac;
    text-shadow: 0 0 8px rgba(74,222,128,0.9);
    z-index: 4;
  }

  /* Repetida */
  .sticker.repetida {
    filter: brightness(1) saturate(1);
    border: 3px solid #d97706;
    box-shadow: 0 0 0 1px #d97706, 0 4px 16px rgba(217,119,6,0.3);
  }
  .sticker.repetida::after {
    content: attr(data-badge);
    position: absolute;
    top: -1px; right: -1px;
    background: #f59e0b;
    color: #000;
    font-size: 10px;
    font-weight: 800;
    border-radius: 0 9px 0 7px;
    padding: 3px 7px;
    z-index: 4;
    line-height: 1.2;
  }

  .sticker.hidden { display: none; }
  .stickers { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-start; }

  /* ── Botón de repetidas ── */
  .sticker .s-rep-btn {
    display: none;
    position: absolute;
    top: 6px; left: 6px;
    background: rgba(0,0,0,0.6);
    color: #fbbf24;
    font-size: 10px;
    font-weight: 800;
    border-radius: 6px;
    padding: 3px 6px;
    z-index: 5;
    cursor: pointer;
    border: 1.5px solid rgba(245,158,11,0.7);
    line-height: 1;
    letter-spacing: 0.03em;
    backdrop-filter: blur(2px);
    transition: background 0.12s;
    user-select: none;
  }
  .sticker.editable.tengo .s-rep-btn,
  .sticker.editable.repetida .s-rep-btn { display: block; }
  .sticker .s-rep-btn:hover { background: rgba(245,158,11,0.85); color: #000; }

  /* ── Popover de repetidas ── */
  #rep-popover {
    position: fixed;
    z-index: 600;
    background: white;
    border: 1px solid #e2e5ec;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    padding: 14px 16px 12px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    min-width: 180px;
    animation: popIn 0.15s ease;
  }
  #rep-popover.open { display: flex; }
  @keyframes popIn {
    from { opacity:0; transform: scale(0.9) translateY(6px); }
    to   { opacity:1; transform: scale(1) translateY(0); }
  }
  #rep-popover .pop-title {
    font-size: 11px;
    font-weight: 600;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  #rep-popover .pop-name {
    font-size: 13px;
    font-weight: 600;
    color: #111827;
    text-align: center;
    max-width: 160px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #rep-popover .pop-controls {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  #rep-popover .pop-btn {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    border: 1.5px solid #e2e5ec;
    background: #f4f4f5;
    color: #111827;
    font-size: 24px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s, transform 0.1s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #rep-popover .pop-btn:hover { background: #e4e4e7; }
  #rep-popover .pop-btn:active { transform: scale(0.92); }
  #rep-popover .pop-btn.minus { color: #b91c1c; border-color: #fca5a5; background: #fef2f2; }
  #rep-popover .pop-btn.minus:hover { background: #fee2e2; }
  #rep-popover .pop-btn.plus  { color: #15803d; border-color: #86efac; background: #f0fdf4; }
  #rep-popover .pop-btn.plus:hover  { background: #dcfce7; }
  #rep-popover .pop-count {
    font-size: 28px;
    font-weight: 800;
    color: #111827;
    min-width: 36px;
    text-align: center;
    line-height: 1;
  }
  #rep-popover .pop-label {
    font-size: 11px;
    color: #6b7280;
    font-weight: 500;
  }
  #rep-popover .pop-close {
    font-size: 12px;
    color: #9ca3af;
    cursor: pointer;
    padding: 2px 8px;
    border-radius: 6px;
    border: 1px solid #e5e7eb;
    background: none;
    font-family: inherit;
  }
  #rep-popover .pop-close:hover { background: #f4f4f5; color: #374151; }

  /* Loading */
  #loading-overlay { position: fixed; inset: 0; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 200; }
  #loading-overlay .spinner { width: 30px; height: 30px; border: 3px solid #e2e5ec; border-top-color: #16a34a; border-radius: 50%; animation: spin 0.7s linear infinite; }
  #loading-overlay .loading-text { font-size: 13px; color: #6b7280; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #111827; color: #fff; border-radius: 10px; padding: 9px 20px; font-size: 13px; font-weight: 500; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 100; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text">Cargando álbum...</div>
</div>

<div class="container">
  <div class="header">
    <div class="header-left">
      <div class="header-title">Álbum Copa 2026 🏆</div>
      <div class="save-indicator">
        <span class="save-dot" id="save-dot"></span>
        <span id="save-text">Listo</span>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="num num-total" id="s-total">0</div><div class="lbl">Total</div></div>
      <div class="stat"><div class="num num-tengo" id="s-tengo">0</div><div class="lbl">Tengo</div></div>
      <div class="stat"><div class="num num-falta" id="s-falta">0</div><div class="lbl">Me falta</div></div>

     !document.getElementById('menu-dropdown').contains(e.target)) closeMenu();

function setSaveStatus(s){
  const dot=document.getElementById('save-dot'),txt=document.getElementById('save-text');
  if(s==='saving'){dot.className='save-dot saving';txt.textContent='Guardando en Sheets...';}
  if(s==='saved') {dot.className='save-dot';       txt.textContent='Guardado en Sheets ✓';}
  if(s==='error') {dot.className='save-dot error'; txt.textContent='Error al guardar — reintentando...';}
  if(s==='loading'){dot.className='save-dot saving';txt.textContent='Cargando desde Sheets...';}
}

async function loadFromSheets(){
  const res=await fetch(`${APPS_SCRIPT_URL}?action=load`);
  const json=await res.json();
  if(json.ok) return json.state;
  throw new Error('load failed');
}
async function saveToSheets(obj){
  const res=await fetch(`${APPS_SCRIPT_URL}?action=save&data=${encodeURIComponent(JSON.stringify(obj))}`);
  const json=await res.json();
  if(!json.ok) throw new Error('save failed');
}

async function loadState(){
  setSaveStatus('loading');
  try{
    state=await loadFromSheets();
    localStorage.setItem('copa2026_cache',JSON.stringify(state));
    setSaveStatus('saved');
  }catch(e){
    try{const c=localStorage.getItem('copa2026_cache');if(c)state=JSON.parse(c);}catch(_){}
    setSaveStatus('error');
    setTimeout(()=>setSaveStatus('saved'),3000);
  }
}

function saveState(){
  setSaveStatus('saving');
  localStorage.setItem('copa2026_cache',JSON.stringify(state));
  clearTimeout(saveTimeout);
  saveTimeout=setTimeout(async()=>{
    let n=0;
    while(n<3){
      try{await saveToSheets(state);setSaveStatus('saved');return;}
      catch(e){n++;setSaveStatus('error');await new Promise(r=>setTimeout(r,1500*n));}
    }
    setSaveStatus('error');
    showToast('⚠️ No se pudo guardar en Sheets. Datos en caché local.');
  },600);
}

function stateKey(t,n){return `${t}_${n}`;}

// Click en la carta → toggle tengo/no tengo
function toggleSticker(team, num) {
  if(!editMode) return;
  const k=stateKey(team,num);
  const v=state[k]||0;
  if(v===0){ state[k]=1; logCambio(team,num,'agregada'); }
  else     { delete state[k]; logCambio(team,num,'quitada'); }
  saveState(); updateSticker(team,num); updateStats(); updateGroupProgress();
}

// ── Popover de repetidas ───────────────────────────────────
let popTeam=null, popNum=null;

function handleRepBtn(team, num, e) {
  e.stopPropagation();
  if(!editMode) return;
  const k=stateKey(team,num);
  const v=state[k]||0;
  if(v===0) return;
  const rep=v-1;
  // Si aún no hay repetidas → agregar 1 directo, sin popover
  if(rep===0){
    state[k]=2;
    logCambio(team,num,'repetida x1');
    saveState(); updateSticker(team,num); updateStats(); updateGroupProgress();
    return;
  }
  // Ya hay repetidas → abrir popover para ajustar
  openRepPopover(team,num,e);
}

function openRepPopover(team, num, e) {
  popTeam=team; popNum=num;
  const k=stateKey(team,num);
  const v=state[k]||0;
  const rep=Math.max(0,v-1);
  const playerName=(PLAYERS[team]&&PLAYERS[team][num])||`${team} ${num}`;

  document.getElementById('pop-name').textContent=playerName;
  document.getElementById('pop-count').textContent=rep;

  const pop=document.getElementById('rep-popover');
  pop.style.display='flex';
  pop.classList.add('open');

  // Centrado en mobile, cerca del botón en desktop
  if(window.innerWidth < 500){
    pop.style.left = Math.max(8, (window.innerWidth - 200)/2) + 'px';
    pop.style.top  = Math.max(8, (window.innerHeight - 220)/2) + 'px';
  } else {
    const btn=e.currentTarget||e.target;
    const rect=btn.getBoundingClientRect();
    let left=rect.right+10, top=rect.top-20;
    if(left+210>window.innerWidth-8) left=rect.left-218;
    if(top+240>window.innerHeight-8) top=window.innerHeight-248;
    if(top<8) top=8;
    pop.style.left=left+'px';
    pop.style.top=top+'px';
  }
}

function closeRepPopover(){
  document.getElementById('rep-popover').classList.remove('open');
  document.getElementById('rep-popover').style.display='none';
  popTeam=null; popNum=null;
}

function changeRep(delta){
  if(popTeam===null) return;
  const k=stateKey(popTeam,popNum);
  const v=state[k]||0;
  const rep=Math.max(0,v-1);
  const newRep=Math.max(0,Math.min(5,rep+delta));
  const newVal=newRep+1; // siempre al menos 1 (tengo)
  state[k]=newVal;
  if(newRep===0) logCambio(popTeam,popNum,'sin repetidas');
  else logCambio(popTeam,popNum,`repetida x${newRep}`);
  saveState();
  updateSticker(popTeam,popNum);
  updateStats();
  updateGroupProgress();
  document.getElementById('pop-count').textContent=newRep;
}

// Conectar botones del popover
document.getElementById('pop-minus').onclick=(e)=>{ e.stopPropagation(); changeRep(-1); };
document.getElementById('pop-plus').onclick=(e)=>{ e.stopPropagation(); changeRep(+1); };
document.getElementById('pop-close').onclick=(e)=>{ e.stopPropagation(); closeRepPopover(); };
document.addEventListener('click',e=>{
  const pop=document.getElementById('rep-popover');
  if(pop.classList.contains('open')&&!pop.contains(e.target)) closeRepPopover();
});

function logCambio(team,num,accion){
  cambios.unshift(`${team} ${num} — ${accion}`);
  if(cambios.length>30) cambios.pop();
  document.getElementById('cambios-wrap').style.display='';
  document.getElementById('cambios-list').textContent=cambios.slice(0,10).join('\n');
}

function updateSticker(team,num){
  const k=stateKey(team,num),el=document.getElementById(`s-${k}`);
  if(!el) return;
  const v=state[k]||0;
  const wasEditable=el.classList.contains('editable');
  const hadPhoto=el.classList.contains('has-photo');
  el.className='sticker'; el.removeAttribute('data-badge');
  if(wasEditable) el.classList.add('editable');
  if(hadPhoto) el.classList.add('has-photo');
  if(v===1) el.classList.add('tengo');
  else if(v>=2){
    el.classList.add('tengo','repetida');
    const rep=v-1;
    el.setAttribute('data-badge',`x${rep}`);
  }
  // Actualizar label del botón de repetidas
  const repBtn=el.querySelector('.s-rep-btn');
  if(repBtn){
    const rep=v>=2 ? v-1 : 0;
    repBtn.textContent = rep>0 ? `+${rep}` : '+';
    repBtn.title = rep>0 ? `${rep} repetida${rep>1?'s':''} — click para cambiar` : 'Agregar repetida';
  }
  applyFilterToSticker(el);
}

function applyFilterToSticker(el){
  const iT=el.classList.contains('tengo'),iR=el.classList.contains('repetida');
  if(curFilter==='all')       el.classList.remove('hidden');
  else if(curFilter==='tengo')     el.classList.toggle('hidden',!iT&&!iR);
  else if(curFilter==='falta')     el.classList.toggle('hidden',iT||iR);
  else if(curFilter==='repetida')  el.classList.toggle('hidden',!iR);
}

function updateStats(){
  let total=0,tengo=0,repetidas=0;
  GROUPS.forEach(g=>Object.entries(g.teams).forEach(([t,c])=>{
    for(let i=1;i<=c;i++){total++;const v=state[stateKey(t,i)]||0;if(v>=1)tengo++;if(v>=2)repetidas+=(v-1);}
  }));
  document.getElementById('s-total').textContent=total;
  document.getElementById('s-tengo').textContent=tengo;
  document.getElementById('s-falta').textContent=total-tengo;
  document.getElementById('s-repetida').textContent=repetidas;
}

function updateGroupProgress(){
  GROUPS.forEach(g=>{
    let tot=0,have=0;
    Object.entries(g.teams).forEach(([t,c])=>{for(let i=1;i<=c;i++){tot++;if((state[stateKey(t,i)]||0)>=1)have++;}});
    const gid=g.name.replace(/\s/g,'');
    const bar=document.getElementById(`prog-${gid}`),lbl=document.getElementById(`lbl-${gid}`);
    if(bar) bar.style.width=(tot?(have/tot*100).toFixed(0):0)+'%';
    if(lbl) lbl.textContent=`${have}/${tot}`;
  });
}

function setFilter(f){
  curFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>{b.className='filter-btn';if(b.dataset.f===f)b.className+=' active-'+f;});
  applyFilter();
}

function applyFilter(){
  const raw=document.getElementById('search').value.trim().toUpperCase().replace(/\s+/g,'');
  document.getElementById('clear-btn').classList.toggle('visible',raw.length>0);
  GROUPS.forEach(g=>{
    const card=document.getElementById(`card-${g.name.replace(/\s/g,'')}`);
    let anyVisible=false;
    Object.entries(g.teams).forEach(([team,count])=>{
      const sec=document.getElementById(`sec-${team}`);
      let teamVisible=false;
      for(let i=1;i<=count;i++){
        const el=document.getElementById(`s-${stateKey(team,i)}`);
        if(!el) continue;
        const key1=`${team}${i}`,teamName=(TEAM_FULL[team]||team).toUpperCase().replace(/\s+/g,'');
        let matchSearch=true;
        if(raw.length>0) matchSearch=key1.includes(raw)||teamName.includes(raw)||team.includes(raw);
        const iT=el.classList.contains('tengo'),iR=el.classList.contains('repetida');
        let matchFilter=true;
        if(curFilter==='tengo')    matchFilter=iT||iR;
        if(curFilter==='falta')    matchFilter=!iT&&!iR;
        if(curFilter==='repetida') matchFilter=iR;
        const show=matchSearch&&matchFilter;
        el.classList.toggle('hidden',!show);
        if(show){teamVisible=true;anyVisible=true;}
      }
      if(sec) sec.style.display=(raw.length>0&&!teamVisible)?'none':'';
    });
    if(card) card.classList.toggle('group-hidden',raw.length>0&&!anyVisible);
  });
}

function clearFilter(){document.getElementById('search').value='';applyFilter();}

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

function exportarFaltantes(){
  let lines=['FIGURITAS QUE ME FALTAN - Copa 2026\n'];
  GROUPS.forEach(g=>{
    let grupo=[];
    Object.entries(g.teams).forEach(([t,c])=>{
      const f=[];for(let i=1;i<=c;i++)if(!state[stateKey(t,i)])f.push(`${t} ${i}`);
      if(f.length) grupo.push(f.join(', '));
    });
    if(grupo.length) lines.push(`${g.name}:\n${grupo.join('\n')}`);
  });
  const text=lines.join('\n');
  navigator.clipboard.writeText(text).then(()=>showToast('Lista de faltantes copiada!')).catch(()=>{const w=window.open();w.document.write('<pre>'+text+'</pre>');});
}

function exportarRepetidas(){
  let lines=['FIGURITAS REPETIDAS - Copa 2026\n'];
  GROUPS.forEach(g=>{
    let rep=[];
    Object.entries(g.teams).forEach(([t,c])=>{
      for(let i=1;i<=c;i++){const v=state[stateKey(t,i)]||0;if(v>=2)rep.push(`${t} ${i} x${v-1}`);}
    });
    if(rep.length) lines.push(`${g.name}:\n${rep.join(', ')}`);
  });
  const text=lines.join('\n');
  navigator.clipboard.writeText(text).then(()=>showToast('Lista de repetidas copiada!')).catch(()=>{const w=window.open();w.document.write('<pre>'+text+'</pre>');});
}

async function resetear(){
  closeMenu();
  if(!confirm('¿Reiniciar el álbum?\n\nEsta acción borrará TODAS las figuritas marcadas y no se puede deshacer.')) return;
  if(!confirm('¿Estás seguro? Se perderán todos los datos.')) return;
  state={};
  localStorage.removeItem('copa2026_cache');
  await saveToSheets({});
  document.querySelectorAll('.sticker').forEach(el=>{
    const wasEditable=el.classList.contains('editable');
    el.className='sticker';el.removeAttribute('data-badge');
    if(wasEditable) el.classList.add('editable');
    applyFilterToSticker(el);
  });
  updateStats();updateGroupProgress();
  cambios=[];document.getElementById('cambios-wrap').style.display='none';
  setSaveStatus('saved');showToast('Álbum reiniciado');
}

function buildUI(){
  const container=document.getElementById('groups-container');
  GROUPS.forEach(g=>{
    const gid=g.name.replace(/\s/g,'');
    const groupLetter = g.name.replace('Grupo ','').replace('Especiales','E_');
    const card=document.createElement('div');card.className='group-card';card.id=`card-${gid}`;card.setAttribute('data-group', groupLetter);
    const header=document.createElement('div');header.className='group-header';
    header.innerHTML=`<span class="group-title">${g.name}</span><span class="group-progress" id="lbl-${gid}">0/0</span>`;
    const progWrap=document.createElement('div');progWrap.className='progress-bar-wrap';
    const progBar=document.createElement('div');progBar.className='progress-bar';progBar.id=`prog-${gid}`;progBar.style.width='0%';
    progWrap.appendChild(progBar);
    const body=document.createElement('div');body.className='group-body';
    header.onclick=()=>{collapsed[gid]=!collapsed[gid];body.className='group-body'+(collapsed[gid]?' collapsed':'');};
    const grid=document.createElement('div');grid.className='teams-grid';

    Object.entries(g.teams).forEach(([team,count])=>{
      const td=TEAM_DATA[team]||{flag:'🏳️',grad:'linear-gradient(160deg,#374151,#1f2937)'};
      const iso=TEAM_ISO[team];
      const flagImgSrc=iso?`https://flagicons.lipis.dev/flags/4x3/${iso}.svg`:null;
      const sec=document.createElement('div');sec.className='team-section';sec.id=`sec-${team}`;
      // label: imagen pequeña en el team label también
      const labelFlag = flagImgSrc
        ? `<img src="${flagImgSrc}" style="width:16px;height:12px;object-fit:cover;border-radius:1px;vertical-align:middle;margin-right:3px;" onerror="this.style.display='none'">`
        : td.flag+' ';
      sec.innerHTML=`<div class="team-label">${labelFlag}${team} — ${TEAM_FULL[team]||team}</div>`;
      const sd=document.createElement('div');sd.className='stickers';

      for(let i=1;i<=count;i++){
        const s=document.createElement('div');
        s.className='sticker';
        s.id=`s-${stateKey(team,i)}`;
        s.style.background=td.grad;
        s.dataset.team = team;
        s.dataset.num = i;
        s.onclick=(e)=>toggleSticker(team,i);

        // Elementos de foto
        const photoEl = document.createElement('div'); photoEl.className = 's-photo';
        const overlayEl = document.createElement('div'); overlayEl.className = 's-photo-overlay';
        s.appendChild(photoEl);
        s.appendChild(overlayEl);

        // Número flotante top-left (visible sin foto)
        const numTopEl = document.createElement('div'); numTopEl.className='s-num-top'; numTopEl.textContent=i;
        s.appendChild(numTopEl);

        // Botón de repetidas (top-left, solo visible cuando tengo)
        const repBtn = document.createElement('div'); repBtn.className='s-rep-btn';
        repBtn.textContent='+'; repBtn.title='Agregar repetida';
        repBtn.onclick=(e)=>handleRepBtn(team,i,e);
        s.appendChild(repBtn);

        // Banda inferior con toda la info
        const playerName = (PLAYERS[team] && PLAYERS[team][i]) || '';
        s.title = playerName ? `${team} ${i} — ${playerName}` : `${team} ${i}`;

        const band = document.createElement('div'); band.className = 's-band';

        // Número en la banda
        const numEl = document.createElement('div'); numEl.className='s-num'; numEl.textContent=i;
        band.appendChild(numEl);

        // Nombre
        if(playerName){
          const nameEl = document.createElement('div'); nameEl.className='s-name'; nameEl.textContent=playerName;
          band.appendChild(nameEl);
        }

        // Fila: bandera + código
        const bottomRow = document.createElement('div'); bottomRow.className='s-bottom';
        const flagEl = document.createElement('div'); flagEl.className='s-flag';
        if(flagImgSrc){
          const img=document.createElement('img');
          img.src=flagImgSrc; img.alt=team;
          img.onerror=()=>{ flagEl.textContent=td.flag; };
          flagEl.appendChild(img);
        } else {
          flagEl.textContent=td.flag;
        }
        const codeEl = document.createElement('div'); codeEl.className='s-code'; codeEl.textContent=team;
        bottomRow.appendChild(flagEl);
        bottomRow.appendChild(codeEl);
        band.appendChild(bottomRow);

        s.appendChild(band);
        sd.appendChild(s);
      }
      sec.appendChild(sd);grid.appendChild(sec);
    });

    body.appendChild(grid);
    card.appendChild(header);card.appendChild(progWrap);card.appendChild(body);
    container.appendChild(card);
  });
}

const photoCache = {};

async function loadPlayerPhoto(team, num, photoEl, overlayEl) {
  const key = `${team}_${num}`;
  const wikiName = WIKI_NAMES[key];
  if (!wikiName) return;

  if (photoCache[key]) {
    applyPhoto(photoEl, overlayEl, photoCache[key]);
    return;
  }

  try {
    const title = encodeURIComponent(wikiName);
    const url = `https://en.wikipedia.org/w/api.php?action=query&titles=${title}&prop=pageimages&format=json&pithumbsize=200&origin=*`;
    const res = await fetch(url);
    if (!res.ok) return;
    const data = await res.json();
    const pages = data?.query?.pages;
    if (!pages) return;
    const page = Object.values(pages)[0];
    const thumb = page?.thumbnail?.source;
    if (thumb) {
      photoCache[key] = thumb;
      applyPhoto(photoEl, overlayEl, thumb);
    }
  } catch(e) {}
}

function applyPhoto(photoEl, overlayEl, url) {
  photoEl.style.backgroundImage = `url('${url}')`;
  photoEl.classList.add('loaded');
  photoEl.closest('.sticker').classList.add('has-photo');
  if (overlayEl) overlayEl.style.display = 'block';
}

// Carga lazy con IntersectionObserver
let photoObserver;
function initPhotoObserver() {
  photoObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const el = entry.target;
        const team = el.dataset.team;
        const num = parseInt(el.dataset.num);
        const photoEl = el.querySelector('.s-photo');
        const overlayEl = el.querySelector('.s-photo-overlay');
        if (photoEl && !photoEl.classList.contains('loaded')) {
          loadPlayerPhoto(team, num, photoEl, overlayEl);
        }
        photoObserver.unobserve(el);
      }
    });
  }, { rootMargin: '100px' });
}

async function init(){
  initPhotoObserver();
  buildUI();
  await loadState();
  GROUPS.forEach(g=>Object.entries(g.teams).forEach(([t,c])=>{for(let i=1;i<=c;i++)if(state[stateKey(t,i)])updateSticker(t,i);}));
  updateStats();updateGroupProgress();
  // Observar todos los stickers para lazy-load de fotos
  document.querySelectorAll('.sticker[data-team]').forEach(el => {
    if (WIKI_NAMES[`${el.dataset.team}_${el.dataset.num}`]) {
      photoObserver.observe(el);
    }
  });
  document.getElementById('loading-overlay').style.display='none';
}

init();
